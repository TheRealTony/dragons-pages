<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
<title>Dragons – Horaire 2026-27</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #f3f5f9;
        --surface: #ffffff;
        --surface-2: #f6f7fa;
        --border: #e3e6ed;
        --text: #141922;
        --muted: #687082;
        --faint: #9aa1b0;
        --accent: #FDB714;
        --accent-ink: #231800;
        --accent-soft: #fff6dc;

        --win: #15803d;   --win-bg: #e6f6ec;
        --loss: #c62828;  --loss-bg: #fdeaea;
        --tie: #2f5bd3;   --tie-bg: #e8eefc;
        --live: #e11d48;
        --home-bg: #e0d7fa; --home-border: #a995ea;

        --c-jaguars: #FDB714;
        --c-lions: #eb7923;
        --c-tigres: #565A5C;
        --c-autre: #FDB714;

        --radius: 14px;
        --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 1px 3px rgba(16, 24, 40, .06);
        --header-bg: rgba(255, 255, 255, .82);
    }
    @media (prefers-color-scheme: dark) {
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --surface-2: #1d232c;
            --border: #2a313c;
            --text: #e8edf3;
            --muted: #9aa3af;
            --faint: #6b7380;
            --accent-soft: rgba(253, 183, 20, .10);

            --win: #4ade80;   --win-bg: rgba(74, 222, 128, .12);
            --loss: #f87171;  --loss-bg: rgba(248, 113, 113, .12);
            --tie: #7ea6ff;   --tie-bg: rgba(126, 166, 255, .14);
            --live: #fb7185;
            --home-bg: #342b5c; --home-border: #6a59b3;

            --c-tigres: #a3a8ab;

            --shadow: 0 1px 2px rgba(0, 0, 0, .4);
            --header-bg: rgba(13, 17, 23, .82);
        }
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
        margin: 0;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        font-size: 15px;
        line-height: 1.45;
        -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }
    button { font: inherit; color: inherit; }
    .wrap { max-width: 980px; margin: 0 auto; padding: 0 16px; }

    /* ---------- Header ---------- */
    .topbar {
        position: sticky; top: 0; z-index: 10;
        background: var(--header-bg);
        backdrop-filter: saturate(180%) blur(14px);
        -webkit-backdrop-filter: saturate(180%) blur(14px);
        border-bottom: 1px solid var(--border);
        padding-top: env(safe-area-inset-top);
    }
    .topbar-row { display: flex; align-items: center; gap: 12px; height: 60px; }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
    .logo {
        flex: none; height: 44px; width: auto; display: block;
    }
    .brand h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
    .brand p { margin: 0; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .brand > div { min-width: 0; }

    .icon-btn {
        flex: none; width: 38px; height: 38px; border-radius: 10px;
        border: 1px solid var(--border); background: var(--surface);
        display: grid; place-items: center; cursor: pointer;
    }
    .icon-btn:hover { background: var(--surface-2); }
    .icon-btn svg { width: 18px; height: 18px; }
    .spinning svg { animation: spin .9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .progress { height: 2px; background: transparent; overflow: hidden; }
    .progress span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s ease, opacity .4s; }

    /* Segmented control */
    .seg {
        display: inline-flex; padding: 3px; gap: 2px; flex: none;
        background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
    }
    .seg button {
        border: 0; background: transparent; cursor: pointer;
        padding: 6px 12px; border-radius: 7px; font-size: 13px; font-weight: 600; color: var(--muted);
        display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
    }
    .seg button[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
    .seg .count {
        font-size: 11px; font-weight: 700; min-width: 18px; padding: 0 5px; height: 18px; line-height: 18px;
        border-radius: 9px; background: var(--border); color: var(--muted); text-align: center;
    }
    .seg button[aria-selected="true"] .count { background: var(--accent); color: var(--accent-ink); }

    /* ---------- Filters ---------- */
    /* Division / team picker */
    .picker {
        display: grid; gap: 14px; grid-template-columns: 1fr; padding: 14px;
        background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow);
    }
    .field-label { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    .field-row { display: flex; gap: 8px; }
    .select-wrap { position: relative; flex: 1; min-width: 0; }
    .select-wrap select {
        width: 100%; height: 42px; appearance: none; -webkit-appearance: none;
        padding: 0 36px 0 12px; border-radius: 10px;
        border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
        font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; text-overflow: ellipsis;
    }
    .select-wrap select:disabled { cursor: default; color: var(--muted); }
    .select-wrap svg { position: absolute; right: 12px; top: 50%; width: 16px; height: 16px; transform: translateY(-50%); pointer-events: none; color: var(--muted); }
    .star-btn {
        flex: none; display: inline-flex; align-items: center; gap: 6px; height: 42px; padding: 0 12px;
        border-radius: 10px; border: 1px solid var(--border); background: var(--surface);
        font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; white-space: nowrap;
    }
    .star-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; }
    .star-btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--text); }
    .star-btn[aria-pressed="true"] svg { fill: var(--accent); stroke: var(--accent); }
    .star-btn:disabled { opacity: .45; cursor: default; }
    @media (min-width: 720px) {
        .picker { grid-template-columns: 1fr 1fr; }
    }

    /* ---------- Sections ---------- */
    main { padding-bottom: 48px; }
    .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 28px 0 12px; }
    .section-head h2 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -.02em; }
    .section-head span { font-size: 13px; color: var(--muted); }

    .day { margin-bottom: 18px; }
    .day-title {
        display: flex; align-items: center; gap: 8px;
        margin: 0 0 8px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
    }
    .day-title small { font-weight: 500; text-transform: none; letter-spacing: 0; color: var(--faint); }
    .day.today .day-title { color: var(--text); }
    .day.today .day-title::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

    .cards { display: grid; gap: 10px; grid-template-columns: 1fr; }
    @media (min-width: 720px) { .cards { grid-template-columns: 1fr 1fr; } }

    /* ---------- Game card ---------- */
    .game {
        position: relative; background: var(--surface); border: 1px solid var(--border);
        border-radius: var(--radius); box-shadow: var(--shadow);
        padding: 12px 14px 10px; overflow: hidden;
    }
    .game::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: transparent; }
    .game[data-result="win"]::before { background: var(--win); }
    .game[data-result="loss"]::before { background: var(--loss); }
    .game[data-result="tie"]::before { background: var(--tie); }
    .game.duel { background: linear-gradient(var(--accent-soft), var(--accent-soft)), var(--surface); border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
    .game.duel::before { background: var(--accent); }
    /* Home games of the selected team */
    .game.home { background: var(--home-bg); border-color: var(--home-border); }
    .game.home .game-foot { border-top-color: var(--home-border); }
    .game.home .row .side, .game.home .venue, .game.home .row .rec { color: var(--text); opacity: .7; }
    .legend { display: flex; align-items: center; gap: 6px; margin: 0 0 8px 2px; font-size: 12px; color: var(--muted); }
    .legend i { width: 14px; height: 14px; border-radius: 4px; background: var(--home-bg); border: 1px solid var(--home-border); }

    .game-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .when { font-size: 13px; font-weight: 600; color: var(--text); }
    .when .cat { color: var(--muted); font-weight: 500; }
    .badges { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .badge {
        font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
        background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); white-space: nowrap;
    }
    .badge.win { background: var(--win-bg); color: var(--win); border-color: transparent; }
    .badge.loss { background: var(--loss-bg); color: var(--loss); border-color: transparent; }
    .badge.tie { background: var(--tie-bg); color: var(--tie); border-color: transparent; }
    .badge.duel { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
    .badge.live { background: var(--live); color: #fff; border-color: transparent; display: inline-flex; align-items: center; gap: 5px; }
    .badge.live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #fff; animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .3; } }

    .row { display: flex; align-items: center; gap: 8px; padding: 5px 0; }
    .row .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--border); }
    .row.is-r .dot { background: var(--team); }
    .row .name { flex: 1; min-width: 0; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row.is-r .name { font-weight: 700; }
    .row .side { flex: none; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--faint); }
    .row .pts { flex: none; width: 28px; text-align: right; font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .row .pts:empty { display: none; }
    .row.trail .pts, .row.trail .name { color: var(--muted); }
    .row.trail .pts { font-weight: 600; }

    .game-foot {
        display: flex; align-items: center; justify-content: space-between; gap: 8px;
        margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border);
    }
    .venue { display: flex; align-items: center; gap: 5px; min-width: 0; font-size: 12.5px; color: var(--muted); }
    .venue span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    a.venue { text-decoration: none; }
    a.venue span { text-decoration: underline; text-decoration-color: var(--border); text-underline-offset: 3px; }
    a.venue:hover { color: var(--text); }
    .venue svg { flex: none; width: 14px; height: 14px; }
    .links { display: flex; gap: 6px; flex: none; }
    .links a {
        font-size: 12px; font-weight: 600; text-decoration: none;
        padding: 5px 10px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--border);
    }
    .links a:hover { border-color: var(--muted); }

    /* ---------- Team view ---------- */
    .team { margin-top: 18px; }
    .team-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
    .team-id { display: flex; align-items: stretch; gap: 10px; min-width: 0; }
    .team-bar { flex: none; width: 4px; min-height: 36px; border-radius: 2px; background: var(--team); }
    .team-id h3 { margin: 0 0 2px; font-size: 15.5px; font-weight: 700; }
    .team-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 12.5px; }
    .record { display: flex; gap: 8px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .record .w { color: var(--win); } .record .l { color: var(--loss); } .record .t { color: var(--tie); }
    .rank { color: var(--muted); font-weight: 600; }
    .form { display: inline-flex; gap: 3px; }
    .form i {
        width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center;
        font-style: normal; font-size: 10px; font-weight: 800;
    }
    .form .win { background: var(--win-bg); color: var(--win); }
    .form .loss { background: var(--loss-bg); color: var(--loss); }
    .form .tie { background: var(--tie-bg); color: var(--tie); }
    button.badge { cursor: pointer; font-family: inherit; }
    .row .rec, .next .rec { flex: none; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

    /* Next game */
    .next {
        position: relative; margin-top: 14px; padding: 14px 16px 14px 21px; overflow: hidden;
        border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow);
        background: linear-gradient(var(--accent-soft), var(--accent-soft)), var(--surface);
    }
    .next::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--team); }
    .next-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .next-label { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .next-when { margin: 6px 0 4px; font-size: 21px; font-weight: 800; letter-spacing: -.02em; line-height: 1.2; }
    .next-match { font-size: 15px; }
    .next-match strong { font-weight: 700; }
    .next-match .vs { color: var(--muted); }
    .next-foot {
        display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
        margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--border);
    }
    .next-venue { display: flex; gap: 7px; min-width: 0; font-size: 12.5px; color: var(--muted); }
    .next-venue svg { flex: none; width: 16px; height: 16px; margin-top: 2px; }
    .next-venue b { display: block; font-size: 13.5px; font-weight: 600; color: var(--text); }
    .btn {
        display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 10px;
        background: var(--text); color: var(--bg); font-size: 13px; font-weight: 700; text-decoration: none; white-space: nowrap;
    }

    /* Horaire / Classement / Suspensions tabs */
    .seg.view-tabs { display: flex; margin-top: 14px; }
    .seg.view-tabs button { flex: 1; justify-content: center; padding: 9px 6px; }
    .seg .count.alert, .seg button[aria-selected="true"] .count.alert { background: var(--loss); color: #fff; }

    /* Standings */
    .panel { margin-top: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
    .panel-title { padding: 12px 14px 0; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    .standings { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
    .standings th { padding: 10px 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--faint); border-bottom: 1px solid var(--border); }
    .standings td { padding: 10px 6px; text-align: center; border-bottom: 1px solid var(--border); }
    .standings tr:last-child td { border-bottom: 0; }
    .standings .c-rank { width: 38px; padding-left: 12px; color: var(--muted); font-weight: 700; }
    .standings .c-team { width: 100%; max-width: 0; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .standings .c-pts { padding-right: 14px; font-weight: 800; }
    .standings tr.is-r .c-team { font-weight: 700; }
    .standings tr.is-r .c-team::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 7px; border-radius: 50%; background: var(--team); }
    .standings tr.me { background: var(--accent-soft); }
    .standings .wide { display: none; }
    @media (min-width: 640px) { .standings .wide { display: table-cell; } }
    .panel-foot, .view-foot {
        display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px;
        font-size: 12.5px; color: var(--muted);
    }
    .panel-foot { padding: 10px 14px; border-top: 1px solid var(--border); background: var(--surface-2); }
    .view-foot { margin-top: 10px; padding: 0 2px; }
    .ext { font-weight: 600; color: var(--text); text-decoration: none; white-space: nowrap; }
    .ext:hover { text-decoration: underline; }

    /* Suspensions */
    .susp-group { margin-top: 16px; }
    .susp {
        display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
        margin-bottom: 8px; padding: 12px 14px;
        background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow);
    }
    .susp.is-r { border-left: 3px solid var(--team); }
    .susp-name { font-weight: 700; }
    .susp-meta { font-size: 12.5px; color: var(--muted); }
    .susp-meta a { font-weight: 600; text-decoration: none; }
    .susp .badge { flex: none; }
    details.others summary { padding: 8px 2px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); }

    /* ---------- States ---------- */
    .empty, .notice {
        padding: 18px; text-align: center; color: var(--muted); font-size: 14px;
        background: var(--surface); border: 1px dashed var(--border); border-radius: var(--radius);
    }
    .cards .empty { grid-column: 1 / -1; }
    .notice.error { color: var(--loss); border-style: solid; border-color: var(--loss-bg); background: var(--loss-bg); }
    .notice button {
        margin-top: 10px; padding: 8px 14px; border-radius: 10px; border: 0; cursor: pointer;
        background: var(--text); color: var(--bg); font-weight: 600;
    }
    .hint { margin: 0 0 10px; font-size: 13px; color: var(--muted); }
    .skeleton {
        height: 118px; border-radius: var(--radius); border: 1px solid var(--border);
        background: linear-gradient(90deg, var(--surface) 0%, var(--surface-2) 50%, var(--surface) 100%);
        background-size: 200% 100%; animation: shimmer 1.3s ease-in-out infinite;
    }
    .skeleton.slim { height: 60px; }
    @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }

    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
<style>
    /* ---------- Dragons additions ---------- */
    [hidden] { display: none !important; }
    .logo-ph {
        flex: none; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center;
        background: var(--accent); color: var(--accent-ink); font-size: 22px; font-weight: 800;
    }
    /* The logo is black on white: multiplied over a gold tile, it reads as a black dragon on gold in both themes */
    .logo-tile { flex: none; width: 46px; height: 46px; display: grid; place-items: center; border-radius: 6px; background: var(--accent); isolation: isolate; }
    .logo-tile img { display: block; width: 42px; height: 42px; mix-blend-mode: multiply; }
    .season-pick { margin-top: 16px; }
    .opp-pick { max-width: 340px; margin-bottom: 10px; }
    .stale {
        display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px;
        margin-top: 16px; padding: 10px 14px; font-size: 13px; color: var(--muted);
        background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--border)); border-radius: var(--radius);
    }
    .stale b { color: var(--text); font-weight: 600; }
    .standings .c-num { width: 44px; padding-left: 12px; color: var(--muted); font-weight: 700; }
    .standings tr.top td { font-weight: 700; }
    .susp-reason { margin-top: 2px; font-size: 13px; }
    /* ---------- Aréna style: scoreboard look, condensed capitals, dark hero ---------- */
    :root { --radius: 8px; --display: "Barlow Condensed", Inter, sans-serif; }
    .topbar { border-bottom: 3px solid var(--accent); }
    :is(.brand h1, .next-when, .next-label, .team-id h3, .row .name, .row .pts, .seg button, .badge, .standings th, .when) { font-family: var(--display); }
    .brand h1 { font-size: 26px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; line-height: 1; }
    .logo-ph { border-radius: 6px; font-family: var(--display); font-size: 28px; }
    .next {
        background: linear-gradient(135deg, #0b0e14 0%, #171d2a 55%, #33290a 100%); color: #fff; border-color: #2a313c;
        box-shadow: 0 14px 34px -14px rgba(0, 0, 0, .55), inset 0 0 0 1px rgba(253, 183, 20, .22);
    }
    .next::before { width: 6px; }
    .next-label { color: var(--accent); font-size: 14px; }
    .next-when { font-size: 36px; font-weight: 800; text-transform: uppercase; letter-spacing: .01em; color: #fff; }
    @media (max-width: 480px) { .next-when { font-size: 28px; } }
    .next-match { color: #e8edf3; font-size: 16px; }
    :is(.next .vs, .next .rec, .next-venue) { color: #9aa3af; }

    // The league site does not allow other pages to read its data. To get live data, put the address of a
    // relay here (it receives the encoded league URL appended to it); otherwise the saved copy is shown.
    const PROXY_URL = "https://dragons-relay.tony-browne2010.workers.dev/?url=";

    const ROUTER = `${SITE}/shark_modules/modules/Router.php?type=data&lang=fr&lang_link_prefix=`;
    const cols = (spec) => spec.split(",").map((c, i) => {
        const [name, type] = c.split(":");
        return `&params[columns][${i}][columnData][0][name]=${name}&params[columns][${i}][columnData][0][type]=${type}`;
    }).join("");

    // Same queries as maj-dragons.ps1
    const Q = {
        seasons: () => `&path=Team/&module=TeamSeasons&params[year]=${YEAR_NO}&params[teamNo]=${TEAM_NO}`,
        team: (s) => `&path=&module=Team&params[seasonNo]=${s}&params[teamNo]=${TEAM_NO}`,
        calendar: (s) => `&path=&module=TeamCalendar${cols("GameNo:GameNoText,GameDate:DatedddDMMMYYYY,TeamLogoCityNameAwayCalendar:TeamImageNameCity,CalendarResult:CalendarResult,TeamLogoCityNameLocalCalendar:TeamImageNameCity,TimeStatus:TimeStatus,PlaceLink:Link")}&params[teamNo]=${TEAM_NO}&params[seasonNo]=${s}`,
        players: (s) => `&path=&module=TeamPlayerStats${cols("Rank:Text,TeamRosterPlayerNumber:Text,PlayerLogoNameWithPosition:ImageNameCityRookie,TeamPlayerPJ:Text,TeamB:Text,TeamA:Text,TeamPlayerPTS:Text,PUN:Text")}&params[teamNo]=${TEAM_NO}&params[seasonNo]=${s}`,
        standing: (s, classNo) => `&module=Standing&configSection=StandingConfig&params[seasonNo]=${s}&params[classNo]=${classNo}`,
        susp: (s) => `&path=&module=Suspension${cols("SuspensionDate:DateYYYYMMDD,SuspensionPlayerImageName:ImageNameLink,SuspensionTeam:Text,SuspensionMotif:Text,SuspensionPartsNb:SuspensionNbParties,SuspensionEndDate:DateAndTime")}&params[seasonNo]=${s}&params[classNo]=`,
    };

    // ---------- Helpers ----------
    const $ = (sel) => document.querySelector(sel);
    const esc = (v) => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const int = (v) => { const n = parseInt(v, 10); return Number.isFinite(n) ? n : 0; };
    const isMine = (team) => team?.no === TEAM_NO;

    const fmtDayShort = new Intl.DateTimeFormat("fr-CA", { weekday: "short", day: "numeric", month: "short" });
    const fmtTime = new Intl.DateTimeFormat("fr-CA", { hour: "2-digit", minute: "2-digit" });
    const fmtDayLong = new Intl.DateTimeFormat("fr-CA", { weekday: "long", day: "numeric", month: "long" });
    const fmtDate = new Intl.DateTimeFormat("fr-CA", { day: "numeric", month: "short", year: "numeric" });
    const fmtStamp = new Intl.DateTimeFormat("fr-CA", { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" });
    const startOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const ordinal = (n) => n === 1 ? "1ᵉʳ" : `${n}ᵉ`;

    let route = PROXY_URL ? 1 : 0;      // 0 = league site directly, 1 = through PROXY_URL
    async function fetchRouter(query) {
        const url = ROUTER + query;
        const routes = PROXY_URL ? [url, PROXY_URL + encodeURIComponent(url)] : [url];
        let lastErr;
        for (let i = Math.min(route, routes.length - 1); i < routes.length; i++) {
            try {
                const resp = await fetch(routes[i], { cache: "no-store" });
                if (resp.ok) { route = i; return await resp.json(); }
                lastErr = new Error(`HTTP ${resp.status}`);
            } catch (e) { lastErr = e; }
        }
        throw lastErr;
    }

    function readSnapshot() {
        try { return JSON.parse($("#snapshot").textContent); } catch { return null; }
    }

    // ---------- Parsing (the league API answers with display tables: rows of named cells) ----------
    const tableRows = (t) => Array.isArray(t?.data)
        ? t.data.map(r => Object.fromEntries((r.columns || []).map(c => [c.name, c.value || []])))
        : null;

    function parseGames(t) {
        const side = (v = []) => ({ no: v[8] || "", name: (v[9] || "").trim(), abbr: v[6] || "" });
        return (tableRows(t) || []).map(c => {
            const date = c.GameDate?.[0], ts = c.TimeStatus || [];
            const status = ts[0] || "", time = ts[1] || "";
            const [a, h] = (c.CalendarResult?.[0] || "").split("-").map(int);
            const start = date ? new Date(`${date}T${time || "00:00:00"}`) : null;
            return {
                no: c.GameNo?.[1] || "",
                start: start && !isNaN(start) ? start : null,
                hasTime: !!time,
                status,
                away: side(c.TeamLogoCityNameAwayCalendar),
                home: side(c.TeamLogoCityNameLocalCalendar),
                score: status ? { a, h } : null,     // "0 - 0" is sent for games not started yet
                venue: { name: c.PlaceLink?.[1] || "" },
            };
        });
    }

    function parseStanding(t) {
        const rows = tableRows(t);
        return rows && rows.map(c => {
            const id = c.TeamLogoCityName || [];
            const v = int(c.TeamV?.[0]), dr = int(c.TeamDR?.[0]), dp = int(c.TeamDP?.[0]), df = int(c.TeamDF?.[0]), pj = int(c.TeamPJ?.[0]);
            return {
                rank: int(c.Rank?.[0]) || null, no: id[8] || "", name: (id[1] || "").trim(), abbr: id[6] || "",
                pj, v, dr, dp, df, losses: dr + dp + df, ties: Math.max(0, pj - v - dr - dp - df),
                pts: int(c.TeamPTS?.[0]), bp: int(c.TeamBP?.[0]), bc: int(c.TeamBC?.[0]), diff: int(c.TeamDIFF?.[0]),
                seq: c.TeamSEQ?.[0] || "",
            };
        });
    }

    function parsePlayers(t) {
        const rows = tableRows(t);
        return rows && rows.map(c => ({
            num: c.TeamRosterPlayerNumber?.[0] || "", name: (c.PlayerLogoNameWithPosition?.[1] || "").trim(),
            pj: int(c.TeamPlayerPJ?.[0]), b: int(c.TeamB?.[0]), a: int(c.TeamA?.[0]), pts: int(c.TeamPlayerPTS?.[0]), pun: int(c.PUN?.[0]),
        }));
    }

    function parseSusp(t) {
        const rows = tableRows(t);
        return rows && rows.map(c => {
            const end = c.SuspensionEndDate || [];
            const endDate = end[0] && !end[0].startsWith("0000") ? new Date(`${end[0]}T${end[1] || "23:59:00"}`) : null;
            const date = c.SuspensionDate?.[0] ? new Date(`${c.SuspensionDate[0]}T00:00:00`) : null;
            return {
                date: date && !isNaN(date) ? date : null,
                name: (c.SuspensionPlayerImageName?.[1] || "").trim(),
                abbr: c.SuspensionTeam?.[0] || "",
                reason: c.SuspensionMotif?.[0] || "",
                games: int(c.SuspensionPartsNb?.[0]),
                end: endDate && !isNaN(endDate) ? endDate : null,
            };
        });
    }
    const isActiveSusp = (x) => !x.end || x.end.getTime() >= Date.now();

    // ---------- Game status ----------
    const LONG_AGO = () => Date.now() - 3 * 3600 * 1000;
    const isFinal = (g) => g.status === "END" || (!!g.status && !!g.start && g.start.getTime() < LONG_AGO());
    const isLive = (g) => !!g.status && !isFinal(g);
    // Finished = final, or started more than 3h ago (score not entered yet)
    const isPlayed = (g) => isFinal(g) || (!g.status && !!g.start && g.start.getTime() < LONG_AGO());

    function resultFor(g) {
        if (!g.score || !isFinal(g)) return null;
        const mine = isMine(g.home) ? g.score.h : g.score.a, theirs = isMine(g.home) ? g.score.a : g.score.h;
        return mine > theirs ? "win" : mine < theirs ? "loss" : "tie";
    }

    // ---------- State ----------
    const state = {
        loading: false,
        error: null,
        mode: "live",       // "live" | "snapshot"
        fetchedAt: null,
        seasons: [],
        seasonNo: null,
        team: null,
        games: [],
        standing: null,     // null = unavailable
        players: null,
        susp: null,
        view: "games",      // "games" | "standings" | "players" | "susp"
        tab: null,          // "upcoming" | "results"
        opp: "",            // Résultats filter: opponent team no, "" = all opponents
    };

    const standRow = (team) => state.standing?.find(r => r.no === team?.no) || null;
    const seasonStarted = () => !!state.standing && state.standing.some(r => r.pj > 0);

    // "3-2-0 · 2ᵉ" — empty until the season has started
    function recordText(team) {
        const r = standRow(team);
        if (!r || !seasonStarted()) return "";
        return `${r.v}-${r.losses}-${r.ties}${r.rank ? ` · ${ordinal(r.rank)}` : ""}`;
    }

    // Suspensions of the division (the league lists the whole season; teams are matched by abbreviation)
    function suspSplit() {
        if (!state.susp) return null;
        const myAbbr = state.team?.st_equip_abbr || standRow({ no: TEAM_NO })?.abbr || "";
        const divAbbrs = new Set((state.standing || []).map(r => r.abbr).filter(Boolean));
        return {
            mine: state.susp.filter(x => myAbbr && x.abbr === myAbbr),
            others: state.susp.filter(x => x.abbr !== myAbbr && divAbbrs.has(x.abbr)),
        };
    }

    // ---------- Loading ----------
    async function loadLive(seasonNo) {
        const seasons = await fetchRouter(Q.seasons());
        const list = Array.isArray(seasons) ? seasons : [];
        const s = String(seasonNo || (list.find(x => x.default) || list[0])?.sais_no || DEFAULT_SEASON_NO);
        const soft = (q) => fetchRouter(q).catch(e => { console.warn("Failed", q, e); return null; });
        const [team, calendar, players] = await Promise.all([soft(Q.team(s)), fetchRouter(Q.calendar(s)), soft(Q.players(s))]);
        const classNo = team?.st_sc_no;
        const [standing, susp] = await Promise.all([classNo ? soft(Q.standing(s, classNo)) : null, soft(Q.susp(s))]);
        return { seasonNo: s, data: { seasons: list, team, calendar, standing, players, susp } };
    }

    let loadToken = 0;
    async function load(seasonNo = null) {
        const token = ++loadToken;
        Object.assign(state, { loading: true, error: null });
        renderAll();

        let res, mode = "live", fetchedAt = new Date();
        try {
            res = await loadLive(seasonNo);
        } catch (e) {
            console.warn("Live data unavailable, using the saved copy", e);
            res = readSnapshot();
            mode = "snapshot";
            fetchedAt = res?.fetchedAt ? new Date(res.fetchedAt) : null;
        }
        if (token !== loadToken) return;

        if (!res?.data?.calendar) {
            Object.assign(state, { loading: false, error: "Impossible de charger l'horaire." });
            renderAll();
            return;
        }
        const d = res.data;
        Object.assign(state, {
            loading: false, mode, fetchedAt,
            seasons: Array.isArray(d.seasons) ? d.seasons : [],
            seasonNo: String(res.seasonNo),
            team: d.team && typeof d.team === "object" ? d.team : null,
            games: parseGames(d.calendar),
            standing: parseStanding(d.standing),
            players: parsePlayers(d.players),
            susp: parseSusp(d.susp),
            tab: null,
        });
        renderAll();
    }

    // ---------- Rendering ----------
    const ICON_PIN = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>`;
    const ICON_CHEVRON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>`;
    const RESULT_LABEL = { win: "Victoire", loss: "Défaite", tie: "Nulle" };
    const TEAM_STYLE = ` style="--team: var(--accent)"`;
    const ext = (href, label) => `<a class="ext" target="_blank" rel="noopener" href="${esc(href)}">${label} ↗</a>`;

    // All games are played at the same complex: only the rink name is shown
    const venueLabel = (g) => `<div class="venue">${ICON_PIN}<span>${esc(g.venue.name || "Glace à déterminer")}</span></div>`;

    function teamRow(team, side, pts, lead, rec) {
        const cls = ["row"];
        if (isMine(team)) cls.push("is-r");
        if (lead && lead !== "tie") cls.push(lead === side ? "lead" : "trail");
        return `<div class="${cls.join(" ")}"${isMine(team) ? TEAM_STYLE : ""}>
            <span class="dot"></span>
            <span class="name" title="${esc(team.name)}">${esc(team.name || "À déterminer")}</span>
            ${rec ? `<span class="rec" title="Fiche V-D-N et rang">${esc(rec)}</span>` : ""}
            <span class="side">${side === "home" ? "Local" : "Visiteur"}</span>
            ${rec ? "" : `<span class="pts">${pts ?? ""}</span>`}
        </div>`;
    }

    function gameCard(g) {
        const sc = g.score;
        const live = isLive(g);
        const result = resultFor(g);
        const lead = sc ? (sc.h > sc.a ? "home" : sc.a > sc.h ? "away" : "tie") : null;
        const when = g.start ? `${fmtDayShort.format(g.start)}${g.hasTime ? ` · ${fmtTime.format(g.start)}` : ""}` : "Date à déterminer";

        const badges = [];
        if (live) badges.push(`<span class="badge live">En direct</span>`);
        if (result) badges.push(`<span class="badge ${result}">${RESULT_LABEL[result]}</span>`);
        if (g.no) badges.push(`<span class="badge">#${esc(g.no)}</span>`);

        // Upcoming games show the opponent's record and rank
        const upcoming = !sc && !isPlayed(g);
        const awayRec = upcoming && !isMine(g.away) ? recordText(g.away) : "";
        const homeRec = upcoming && !isMine(g.home) ? recordText(g.home) : "";

        const links = g.no ? `<div class="links">
            <a href="${SITE}/sommaire/?gameNo=${encodeURIComponent(g.no)}" target="_blank" rel="noopener">Sommaire</a>
            ${isFinal(g) ? `<a href="${SITE}/shark_modules/modules/GameReports/GameSheet.php?site=1&lang=fr&game_no=${encodeURIComponent(g.no)}" target="_blank" rel="noopener">Feuille</a>` : ""}
        </div>` : "";

        return `<article class="game${isMine(g.home) ? " home" : ""}"${result ? ` data-result="${result}"` : ""}>
            <div class="game-top">
                <div class="when">${esc(when)}</div>
                <div class="badges">${badges.join("")}</div>
            </div>
            ${teamRow(g.away, "away", sc?.a, lead, awayRec)}
            ${teamRow(g.home, "home", sc?.h, lead, homeRec)}
            <div class="game-foot">${venueLabel(g)}${links}</div>
        </article>`;
    }

    const skeletons = (n, slim = false) => `<div class="cards">${`<div class="skeleton${slim ? " slim" : ""}"></div>`.repeat(n)}</div>`;

    function renderControls() {
        $("#refreshBtn").classList.toggle("spinning", state.loading);
        const bar = $("#progressBar");
        bar.style.opacity = state.loading ? "1" : "0";
        bar.style.width = state.loading ? "60%" : "100%";

        const season = state.seasons.find(s => String(s.sais_no) === state.seasonNo);
        $("#subtitle").textContent = season?.sais_name || "Horaire et résultats · 2026-27";

        // Season picker (regular season / playoffs), shown once the team has more than one
        $("#seasonPick").innerHTML = state.seasons.length > 1 && state.mode === "live" ? `<div class="select-wrap season-pick">
            <select id="seasonSelect" aria-label="Saison">${state.seasons.map(s =>
                `<option value="${esc(s.sais_no)}"${String(s.sais_no) === state.seasonNo ? " selected" : ""}>${esc(s.sais_name)}</option>`).join("")}</select>
            ${ICON_CHEVRON}
        </div>` : "";

        $("#notice").innerHTML = !state.loading && !state.error && state.mode === "snapshot" ? `<div class="stale">
            <span>Données enregistrées${state.fetchedAt && !isNaN(state.fetchedAt) ? ` le <b>${esc(fmtStamp.format(state.fetchedAt))}</b>` : ""}.</span>
            ${ext(`${SITE}/equipes/?seasonNo=${encodeURIComponent(state.seasonNo)}&teamNo=${TEAM_NO}`, "Site de la ligue")}
        </div>` : "";
    }

    function countdown(g) {
        if (isLive(g)) return "En direct";
        const now = new Date();
        const mins = Math.round((g.start - now) / 60000);
        const days = Math.round((startOfDay(g.start) - startOfDay(now)) / 86400000);
        if (mins <= 0) return "En cours";
        if (mins < 60) return `Dans ${mins} min`;
        if (days === 0) return `Aujourd'hui · dans ${Math.round(mins / 60)} h`;
        if (days === 1) return "Demain";
        return `Dans ${days} jours`;
    }

    // Hero card: the next game
    function nextGameCard() {
        const g = state.games.filter(x => x.start && !isPlayed(x)).sort((a, b) => a.start - b.start)[0];
        if (!g) return "";
        const isHome = isMine(g.home);
        const me = isHome ? g.home : g.away, opp = isHome ? g.away : g.home;
        const oppRec = recordText(opp);
        const day = fmtDayLong.format(g.start);

        return `<article class="next"${TEAM_STYLE}>
            <div class="next-top">
                <span class="next-label">Prochain match</span>
                <span class="badge ${isLive(g) ? "live" : "duel"}">${esc(countdown(g))}</span>
            </div>
            <div class="next-when">${esc(day[0].toUpperCase() + day.slice(1))}${g.hasTime ? ` · ${esc(fmtTime.format(g.start))}` : ""}</div>
            <div class="next-match">
                <strong>${esc(me.name || "Dragons")}</strong>
                <span class="vs">${isHome ? "reçoit" : "visite"}</span>
                <strong>${esc(opp.name || "À déterminer")}</strong>
                ${oppRec ? `<span class="rec">(${esc(oppRec)})</span>` : ""}
            </div>
            <div class="next-foot">
                <div class="next-venue">${ICON_PIN}<div><b>${esc(g.venue.name || "Glace à déterminer")}</b>${isHome ? "Local" : "Visiteur"}</div></div>            </div>
        </article>`;
    }

    function scheduleView() {
        const played = state.games.filter(isPlayed).sort((a, b) => b.start - a.start);
        const upcoming = state.games.filter(g => !isPlayed(g)).sort((a, b) => (a.start ?? Infinity) - (b.start ?? Infinity));

        // Official record, rank and points once the season has started; otherwise counted from the results
        const row = standRow({ no: TEAM_NO });
        const rec = { win: 0, loss: 0, tie: 0 };
        played.forEach(g => { const r = resultFor(g); if (r) rec[r]++; });
        if (row && seasonStarted()) Object.assign(rec, { win: row.v, loss: row.losses, tie: row.ties });
        const rank = row && seasonStarted() && row.rank
            ? `<span class="rank">${ordinal(row.rank)} sur ${state.standing.length} · ${row.pts} pts</span>` : "";

        // Last five results, oldest to newest
        const last = played.filter(resultFor).slice(0, 5).reverse();
        const form = last.length ? `<span class="form" aria-label="Cinq dernières parties">${last.map(g => {
            const r = resultFor(g), opp = isMine(g.home) ? g.away : g.home;
            const tip = `${fmtDayShort.format(g.start)} · ${opp.name || "?"} · ${g.score.a}-${g.score.h}`;
            return `<i class="${r}" title="${esc(tip)}">${RESULT_LABEL[r][0]}</i>`;
        }).join("")}</span>` : "";

        const nSusp = (suspSplit()?.mine || []).filter(isActiveSusp).length;
        const susp = nSusp ? `<button type="button" class="badge loss" data-view="susp">🚫 ${nSusp} suspension${nSusp > 1 ? "s" : ""}</button>` : "";

        const tab = state.tab || (upcoming.length ? "upcoming" : "results");
        const emptyMsg = tab === "upcoming" ? "Aucune partie à venir." : "Aucun résultat pour l'instant.";

        // Résultats can be narrowed to the games against one opponent
        const oppOf = (g) => isMine(g.home) ? g.away : g.home;
        const opps = new Map();
        played.forEach(g => { const o = oppOf(g); if (o.no) opps.set(o.no, { name: o.name, n: (opps.get(o.no)?.n || 0) + 1 }); });
        if (!opps.has(state.opp)) state.opp = "";
        const filter = tab === "results" && opps.size > 1 ? `<div class="select-wrap opp-pick">
            <select id="oppSelect" aria-label="Filtrer par adversaire">
                <option value="">Tous les adversaires (${played.length})</option>
                ${[...opps].sort((a, b) => a[1].name.localeCompare(b[1].name)).map(([no, o]) =>
                    `<option value="${esc(no)}"${no === state.opp ? " selected" : ""}>${esc(o.name)} (${o.n})</option>`).join("")}
            </select>
            ${ICON_CHEVRON}
        </div>` : "";
        const list = tab === "upcoming" ? upcoming : played.filter(g => !state.opp || oppOf(g).no === state.opp);

        return `<div class="team"${TEAM_STYLE}>
            <div class="team-head">
                <div class="team-id">
                    <span class="team-bar"></span>
                    <div>
                        <h3>${esc(state.team?.st_equip_name || "Dragons")}</h3>
                        <div class="team-meta">
                            <span class="record" aria-label="Fiche">
                                <span class="w">${rec.win} V</span><span class="l">${rec.loss} D</span><span class="t">${rec.tie} N</span>
                            </span>
                            ${rank}${form}${susp}
                        </div>
                    </div>
                </div>
                <div class="seg" role="tablist">
                    <button type="button" role="tab" data-tab="upcoming" aria-selected="${tab === "upcoming"}">À venir <span class="count">${upcoming.length}</span></button>
                    <button type="button" role="tab" data-tab="results" aria-selected="${tab === "results"}">Résultats <span class="count">${played.length}</span></button>
                </div>
            </div>
            ${filter}
            ${list.some(g => isMine(g.home)) ? `<div class="legend"><i></i>Parties comme équipe locale</div>` : ""}
            <div class="cards">${list.length ? list.map(gameCard).join("") : `<div class="empty">${emptyMsg}</div>`}</div>
        </div>`;
    }

    function standingsView() {
        const link = ext(`${SITE}/classement/`, "Voir sur le site de la ligue");
        if (!state.standing) return `<div class="notice error" style="margin-top:14px">Classement indisponible pour le moment.<br>${link}</div>`;
        if (!state.standing.length) return `<div class="empty" style="margin-top:14px">Aucun classement pour cette saison.</div>`;

        const started = seasonStarted();
        const rows = state.standing.slice().sort((a, b) => (a.rank ?? 999) - (b.rank ?? 999) || a.name.localeCompare(b.name));
        const body = rows.map(r => {
            const mine = r.no === TEAM_NO;
            const diff = r.diff > 0 ? `+${r.diff}` : r.diff;
            return `<tr class="${mine ? "is-r me" : ""}"${mine ? TEAM_STYLE : ""}>
                <td class="c-rank">${started && r.rank ? r.rank : "–"}</td>
                <td class="c-team" title="${esc(r.name)}">${esc(r.name)}</td>
                <td>${r.pj}</td><td>${r.v}</td><td>${r.dr}</td><td>${r.dp + r.df}</td>
                <td class="wide">${r.bp}</td><td class="wide">${r.bc}</td><td class="wide">${diff}</td>
                <td class="wide">${esc(r.seq.toUpperCase())}</td>
                <td class="c-pts">${r.pts}</td>
            </tr>`;
        }).join("");

        return `<div class="panel">
            <table class="standings">
                <thead><tr>
                    <th class="c-rank">#</th><th class="c-team">Équipe</th>
                    <th title="Parties jouées">PJ</th><th title="Victoires">V</th><th title="Défaites en temps réglementaire">D</th><th title="Défaites en prolongation ou en fusillade">DP</th>
                    <th class="wide" title="Buts pour">BP</th><th class="wide" title="Buts contre">BC</th><th class="wide" title="Différentiel">+/-</th>
                    <th class="wide" title="Séquence">Séq</th>
                    <th class="c-pts" title="Points">Pts</th>
                </tr></thead>
                <tbody>${body}</tbody>
            </table>
            <div class="panel-foot">
                <span>${started ? "Classement officiel" : "La saison n'a pas encore commencé."}</span>
                ${link}
            </div>
        </div>`;
    }

    function playersView() {
        const link = ext(`${SITE}/equipes/?seasonNo=${encodeURIComponent(state.seasonNo)}&teamNo=${TEAM_NO}`, "Voir sur le site de la ligue");
        if (!state.players) return `<div class="notice error" style="margin-top:14px">Statistiques indisponibles pour le moment.<br>${link}</div>`;
        if (!state.players.length) return `<div class="empty" style="margin-top:14px">Aucune statistique pour l'instant.</div>`;

        const top = Math.max(...state.players.map(p => p.pts));
        const body = state.players.map(p => `<tr class="${top > 0 && p.pts === top ? "top" : ""}">
            <td class="c-num">${esc(p.num)}</td>
            <td class="c-team" title="${esc(p.name)}">${esc(p.name)}</td>
            <td>${p.pj}</td><td>${p.b}</td><td>${p.a}</td>
            <td class="wide">${p.pun}</td>
            <td class="c-pts">${p.pts}</td>
        </tr>`).join("");

        return `<div class="panel">
            <table class="standings">
                <thead><tr>
                    <th class="c-num">#</th><th class="c-team">Joueur</th>
                    <th title="Parties jouées">PJ</th><th title="Buts">B</th><th title="Passes">A</th>
                    <th class="wide" title="Minutes de punition">Pun</th>
                    <th class="c-pts" title="Points">Pts</th>
                </tr></thead>
                <tbody>${body}</tbody>
            </table>
            <div class="panel-foot"><span>Statistiques officielles</span>${link}</div>
        </div>`;
    }

    function suspItem(x) {
        const mine = x.abbr === state.team?.st_equip_abbr;
        const badge = isActiveSusp(x)
            ? `<span class="badge loss">${x.end ? `Jusqu'au ${esc(fmtDate.format(x.end))}` : "En cours"}</span>`
            : `<span class="badge">Terminée</span>`;
        const meta = [x.abbr, x.date ? fmtDate.format(x.date) : "", x.games ? `${x.games} partie${x.games > 1 ? "s" : ""}` : ""].filter(Boolean).join(" · ");
        return `<div class="susp${mine ? " is-r" : ""}"${mine ? TEAM_STYLE : ""}>
            <div>
                <div class="susp-name">${esc(x.name || "—")}</div>
                <div class="susp-meta">${esc(meta)}</div>
                ${x.reason ? `<div class="susp-reason">${esc(x.reason)}</div>` : ""}
            </div>
            ${badge}
        </div>`;
    }

    function suspensionsView() {
        const link = ext(`${SITE}/suspensions/`, "Voir sur le site de la ligue");
        const lists = suspSplit();
        let body;
        if (!lists) {
            body = `<div class="notice error">Suspensions indisponibles pour le moment.</div>`;
        } else {
            body = (lists.mine.length ? lists.mine.map(suspItem).join("") : `<div class="empty">Aucune suspension pour les Dragons.</div>`)
                + (lists.others.length ? `<details class="others"><summary>Autres équipes de la division (${lists.others.length})</summary>${lists.others.map(suspItem).join("")}</details>` : "");
        }
        return `<div class="susp-group">${body}<div class="view-foot"><span>Suspensions officielles</span>${link}</div></div>`;
    }

    function renderTeam() {
        const view = $("#teamView");
        if (state.loading) {
            view.innerHTML = `<div style="margin-top:16px">${skeletons(1)}</div><div style="margin-top:14px">${skeletons(4)}</div>`;
            return;
        }
        if (state.error) {
            view.innerHTML = `<div class="notice error" style="margin-top:16px">${esc(state.error)}<br><button type="button" data-action="retry">Réessayer</button></div>`;
            return;
        }

        const nSusp = (suspSplit()?.mine || []).filter(isActiveSusp).length;
        const tab = (id, label) => `<button type="button" role="tab" data-view="${id}" aria-selected="${state.view === id}">${label}</button>`;
        const tabs = `<div class="seg view-tabs" role="tablist">
            ${tab("games", "Horaire")}
            ${tab("standings", "Classement")}
            ${tab("players", "Joueurs")}
            ${tab("susp", `Suspensions${nSusp ? ` <span class="count alert">${nSusp}</span>` : ""}`)}
        </div>`;
        const body = state.view === "standings" ? standingsView()
            : state.view === "players" ? playersView()
            : state.view === "susp" ? suspensionsView()
            : scheduleView();
        view.innerHTML = nextGameCard() + tabs + body;
    }

    function renderAll() {
        renderControls();
        renderTeam();
    }

    // ---------- Events ----------
    $("#refreshBtn").addEventListener("click", () => load(state.seasonNo));

    $("#seasonPick").addEventListener("change", (e) => {
        if (e.target.id === "seasonSelect") load(e.target.value);
    });

    $("#teamView").addEventListener("change", (e) => {
        if (e.target.id !== "oppSelect") return;
        state.opp = e.target.value;
        renderTeam();
    });

    $("#teamView").addEventListener("click", (e) => {
        if (e.target.closest("[data-action=retry]")) { load(state.seasonNo); return; }
        const viewBtn = e.target.closest("[data-view]");
        if (viewBtn) {
            state.view = viewBtn.dataset.view;
            renderTeam();
            return;
        }
        const tab = e.target.closest("[data-tab]");
        if (tab) {
            state.tab = tab.dataset.tab;
            renderTeam();
        }
    });

    if (LOGO_SRC) {
        $("#logoImg").src = LOGO_SRC;
        $("#logoTile").hidden = false;
        $("#logoPh").hidden = true;
        document.head.insertAdjacentHTML("beforeend", `<link rel="icon" href="${LOGO_SRC}">`);
    }

    load();
</script>
</body>
</html>
